<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --border: rgba(255,255,255,0.10);
    --border-hover: rgba(255,255,255,0.22);
    --text: #f0ede8;
    --muted: #7a7870;
    --accent: #d4b896;
    --accent-dim: rgba(212,184,150,0.12);
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .wordmark {
    font-family: 'Instrument Serif', serif;
    font-size: 52px;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 20px;
    text-align: center;
  }

  .tagline {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
    margin-bottom: 64px;
  }

  .tagline .soon {
    color: var(--accent);
  }

  .form-inner {
    width: 100%;
    max-width: 400px;
  }

  .field { margin-bottom: 14px; }

  .field input {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-color: var(--border-hover); }

  .submit-wrap { margin-top: 24px; }

  .submit-btn {
    width: 100%;
    background: var(--text);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 15px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .submit-btn:hover { opacity: 0.85; }

  footer {
    margin-top: 72px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  footer a:hover { color: var(--text); }

  .footer-dot { opacity: 0.4; }

  @media (max-width: 600px) {
    .wordmark { font-size: 40px; }
    .tagline { margin-bottom: 48px; }
    footer { flex-direction: column; gap: 10px; margin-top: 56px; }
    .footer-dot { display: none; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="wordmark">Composite</div>
  <div class="tagline">Bringing the frontier of markets. <span class="soon">Soon.</span></div>

  <div class="form-section" style="width:100%;display:flex;justify-content:center;">
    <div class="form-inner">

      <div class="field">
        <input type="text" placeholder="Name" id="fname" />
      </div>
      <div class="field">
        <input type="email" placeholder="Email" id="femail" />
      </div>
      <div class="field">
        <input type="text" placeholder="Telegram (optional)" id="ftg" />
      </div>

      <div class="submit-wrap">
        <button class="submit-btn" id="submitBtn">Request access →</button>
      </div>

    </div>
  </div>

  <footer>
    <a href="terms.html">Terms &amp; Conditions</a>
    <span class="footer-dot">&middot;</span>
    <a href="privacy.html">Privacy Policy</a>
    <span class="footer-dot">&middot;</span>
    <span>&copy; 2026 Composite. All rights reserved.</span>
  </footer>

</div>

<script>
var submitted = false;
document.getElementById('submitBtn').addEventListener('click', function(e) {
  e.preventDefault();
  if (submitted) return;

  var name = document.getElementById('fname').value.trim();
  var email = document.getElementById('femail').value.trim();
  var tg = document.getElementById('ftg').value.trim();

  if (!name) {
    alert('Please enter your name.');
    return;
  }
  if (!email || email.indexOf('@') === -1 || email.indexOf('.') === -1) {
    alert('Please enter a valid email address.');
    return;
  }

  submitted = true;
  var btn = this;
  btn.textContent = 'Submitting...';
  btn.style.opacity = '0.6';
  btn.disabled = true;

  var params = 'name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email) + '&telegram=' + encodeURIComponent(tg) + '&roles=';
  var url = 'https://script.google.com/macros/s/AKfycbyKsEwSSHpmhlR2ALK5ppkYH5X1NLUaFPxrRPJ55O9DOofsDJDLsY2lfxDjzaIjxNdjUQ/exec?' + params;

  fetch(url, { mode: 'no-cors' }).then(function() {
    document.querySelector('.form-section').innerHTML = '<div style="max-width:480px;margin:0 auto;text-align:center;padding:40px 32px 0">' +
      '<div style="width:56px;height:56px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 28px">' +
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
      '</div>' +
      '<h2 style="font-family:Instrument Serif,serif;font-size:36px;color:var(--text);margin-bottom:12px;letter-spacing:-0.02em">You\'re on the list</h2>' +
      '<p style="font-size:13px;color:var(--muted);line-height:1.7;margin:0 auto;font-weight:300">We\'ll be in touch.</p>' +
    '</div>';
  }).catch(function() {
    submitted = false;
    btn.textContent = 'Request access →';
    btn.style.opacity = '1';
    btn.disabled = false;
    alert('Something went wrong. Please try again.');
  });
});
</script>

</body>
</html>
